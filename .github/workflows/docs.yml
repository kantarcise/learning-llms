name: Documentation build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    # Python 3.12.10 has a setup-python distribution for this runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
      - run: uv run --locked python -m mkdocs build --strict

  experiment-checks:
    # Python 3.12.10 has a setup-python distribution for this runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
      - run: uv run --locked --group experiments ruff check --select ANN .
      - run: uv run --locked --group experiments ruff check experiments/character-logs
      - run: uv run --locked --group experiments ruff format --check experiments/character-logs
      - run: uv run --locked --group experiments python -m unittest discover -s experiments/character-logs -p 'test_*.py' -v

      - run: uv run --locked --group experiments --group cosmopedia ruff check experiments/cosmopedia
      - run: uv run --locked --group experiments --group cosmopedia ruff format --check experiments/cosmopedia
      - run: uv run --locked --group experiments --group cosmopedia python -m unittest discover -s experiments/cosmopedia -p 'test_*.py' -v
