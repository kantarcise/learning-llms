[project]
name = "learning-llms"
version = "0.1.0"
description = "A book companion for Build a Large Language Model (From Scratch)"
requires-python = ">=3.12"
dependencies = ["mkdocs-material==9.6.14"]

[tool.uv]
package = false

[dependency-groups]
experiments = [
    "matplotlib>=3.11.2",
    "ruff>=0.16.10",
    "torch>=2.14.1",
]

[tool.ruff]
# Recorded model answers may contain deliberately invalid Python.
extend-exclude = ["experiments/muse-glimmer/results", "experiments/muse-glimmer/agent-fixture"]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
# Preserve the existing benchmark harness and recorded model answers.
# Its maintained source can adopt annotation checks in a separate change.
"experiments/muse-glimmer/**" = ["ANN"]
