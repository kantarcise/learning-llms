<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Encode messages, then pad token rows</title><desc id="desc">Three SMS messages become rows of five IDs. Padding token 50256 fills shorter rows.</desc><rect width="1000" height="390" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="30" y="40" font-size="24" font-weight="bold">Message → GPT-2 token IDs → Pad to five positions</text><text x="30" y="138" font-size="20">Meet me</text><rect x="330" y="110" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="386" y="140" text-anchor="middle" font-size="20">29318</text><rect x="455" y="110" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="511" y="140" text-anchor="middle" font-size="20">502</text><rect x="580" y="110" width="112" height="48" rx="6" fill="#ffedd5" stroke="#9a5200"/><text x="636" y="140" text-anchor="middle" font-size="20">50256</text><rect x="705" y="110" width="112" height="48" rx="6" fill="#ffedd5" stroke="#9a5200"/><text x="761" y="140" text-anchor="middle" font-size="20">50256</text><rect x="830" y="110" width="112" height="48" rx="6" fill="#ffedd5" stroke="#9a5200"/><text x="886" y="140" text-anchor="middle" font-size="20">50256</text><text x="30" y="238" font-size="20">Meet me at noon</text><rect x="330" y="210" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="386" y="240" text-anchor="middle" font-size="20">29318</text><rect x="455" y="210" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="511" y="240" text-anchor="middle" font-size="20">502</text><rect x="580" y="210" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="636" y="240" text-anchor="middle" font-size="20">379</text><rect x="705" y="210" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="761" y="240" text-anchor="middle" font-size="20">19613</text><rect x="830" y="210" width="112" height="48" rx="6" fill="#ffedd5" stroke="#9a5200"/><text x="886" y="240" text-anchor="middle" font-size="20">50256</text><text x="30" y="338" font-size="20">Meet me at noon today</text><rect x="330" y="310" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="386" y="340" text-anchor="middle" font-size="20">29318</text><rect x="455" y="310" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="511" y="340" text-anchor="middle" font-size="20">502</text><rect x="580" y="310" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="636" y="340" text-anchor="middle" font-size="20">379</text><rect x="705" y="310" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="761" y="340" text-anchor="middle" font-size="20">19613</text><rect x="830" y="310" width="112" height="48" rx="6" fill="#dbeafe" stroke="#315e88"/><text x="886" y="340" text-anchor="middle" font-size="20">1909</text><text x="330" y="380" font-size="16">Blue = original token ID     Orange = added padding ID (50256)</text></g></svg>