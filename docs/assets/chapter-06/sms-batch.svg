<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">One batch pairs eight messages with eight labels</title><desc id="desc">Eight illustrative token rows, each 120 positions wide, align with one class label each.</desc><rect width="900" height="560" fill="white"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="30" y="40" font-size="24" font-weight="bold">One batch = eight messages and eight class labels</text><text x="115" y="85" font-size="20">Input IDs [8, 120]</text><text x="650" y="85" font-size="20">Labels [8]</text><text x="30" y="133" font-size="18">1</text><rect x="100" y="105" width="490" height="38" rx="5" fill="#dbeafe"/><text x="120" y="131" font-size="18" font-family="monospace">101   102   103   …   50256</text><path d="M 600 124 H 660" stroke="#315e88" stroke-width="2"/><rect x="670" y="105" width="65" height="38" rx="5" fill="#dcfce7"/><text x="702" y="131" text-anchor="middle" font-size="18">0</text><text x="30" y="181" font-size="18">2</text><rect x="100" y="153" width="490" height="38" rx="5" fill="#dbeafe"/><text x="120" y="179" font-size="18" font-family="monospace">111   112   113   …   50256</text><path d="M 600 172 H 660" stroke="#315e88" stroke-width="2"/><rect x="670" y="153" width="65" height="38" rx="5" fill="#dcfce7"/><text x="702" y="179" text-anchor="middle" font-size="18">1</text><text x="30" y="229" font-size="18">3</text><rect x="100" y="201" width="490" height="38" rx="5" fill="#dbeafe"/><text x="120" y="227" font-size="18" font-family="monospace">121   122   123   …   50256</text><path d="M 600 220 H 660" stroke="#315e88" stroke-width="2"/><rect x="670" y="201" width="65" height="38" rx="5" fill="#dcfce7"/><text x="702" y="227" text-anchor="middle" font-size="18">0</text><text x="30" y="277" font-size="18">4</text><rect x="100" y="249" width="490" height="38" rx="5" fill="#dbeafe"/><text x="120" y="275" font-size="18" font-famil