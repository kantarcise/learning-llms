<title id="t">Which weights receive an update?</title>
<desc id="d">Read upward from embeddings. In the chapter setup the embeddings and first eleven blocks are frozen. The last block, final LayerNorm and new classifier are trainable. Exercise 6.2 also unfreezes the earlier stages.</desc>
<defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#475d57"/></marker></defs>
<rect width="840" height="448" rx="12" fill="#faf8f3"/>
<g font-family="system-ui,sans-serif" fill="#213631">
<text x="24" y="40" font-family="Georgia,serif" font-size="29" font-weight="bold">Which weights learn from a labeled SMS?</text>
<text x="24" y="76" font-size="16">Follow the message upward. Green rows receive gradient updates in the chapter setup.</text>
<g fill="#d8ecdf"><rect x="62" y="102" width="440" height="46" rx="7"/><rect x="62" y="158" width="440" height="46" rx="7"/><rect x="62" y="214" width="440" height="62" rx="7"/></g>
<g fill="#e5e9e7"><rect x="62" y="288" width="440" height="46" rx="7"/><rect x="62" y="344" width="440" height="46" rx="7"/></g>
<path d="M39 388V110" stroke="#475d57" stroke-width="2" marker-end="url(#a)"/>
<g x="78" font-size="18"><text x="78" y="131">New output head · ham and spam scores</text><text x="78" y="187">Final LayerNorm</text><text x="78" y="239" font-weight="bold">Block 11 · the last transformer block</text><text x="78" y="263" font-size="15">Attention, feedforward layers and both LayerNorms</text><text x="78" y="317">Blocks 0–10 · eleven earlier blocks</text><text x="78" y="373">Token and position embeddings</text></g>
<g stroke="#64786f" fill="none"><path d="M512 105h10v168h-10"/><path d="M512 290h10v98h-10"/></g>
<text x="540" y="175" font-weight="bold" font-size="18">Trainable in both runs</text>
<text x="540" y="202" font-size="16">Adapt the last block and</text><text x="540" y="225" font-size="16">how its features are read.</text>
<text x="540" y="317" font-weight="bold" font-size="18">Frozen in the chapter</text><text x="540" y="345" font-size="16">Exercise 6.2 lets these</text><text x="540" y="368" font-size="16">weights learn too.</text>
