<svg xmlns="http://www.w3.org/2000/svg" width="760" height="820" viewBox="0 0 760 820" role="img" aria-labelledby="title desc"><title id="title">Five stages with and without residual additions</title><desc id="desc">Compare mean absolute weight gradients at each stage. Four identity paths bypass width-preserving transformations on the right. Both networks end with a three-to-one projection and GELU.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365670"/></marker></defs>
