<rect width="760" height="820" rx="15" fill="#f8fafc"/><text class="heading" x="380" y="38">Adding four paths through the same five stages</text><text x="380" y="70">Each box applies Linear → GELU. Numbers are mean absolute weight gradients.</text>
<text x="180" y="112" font-weight="bold">Plain network</text><text class="small" x="180" y="140">Input [1, 0, −1]</text>
