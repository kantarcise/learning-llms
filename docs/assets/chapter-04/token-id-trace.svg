<svg xmlns="http://www.w3.org/2000/svg" width="810" height="512" viewBox="0 0 810 512" role="img" aria-labelledby="title desc"><title id="title">Follow the IDs across six greedy steps</title><desc id="desc">An illustrative sequence grows from four prompt IDs to ten. Each row adds one vocabulary ID. Quoted text displays the newly appended token.</desc><style>text{font:19px Arial,sans-serif;fill:#17344a}.num{font:17px monospace}.new{font-weight:bold;fill:#065547}</style><rect width="810" height="512" rx="15" fill="#f8fafc"/><text x="24" y="40" style="font-size:25px;font-weight:bold">Follow the IDs across six steps</text><text x="24" y="78">Prompt: “Hello, I am” → [15496, 11, 314, 716]</text><text x="24" y="126">Step</text><text x="100" y="126">Sequence after appending the highlighted ID</text><text x="658" y="126">New text</text>
<rect x="15" y="143" width="779" height="43" rx="8" fill="#e0edf5"/><text x="32" y="171">1</text><text x="100" y="171" class="num">[15496, 11, 314, 716, <tspan class="new">257</tspan>]</text><text class="num" x="660" y="171">“ a”</text>
<rect x="15" y="194" width="779" height="43" rx="8" fill="#e0edf5"/><text x="32" y="222">2</text><text x="100" y="222" class="num">[15496, 11, 314, 716, 257, <tspan class="new">2746</tspan>]</text><text class="num" x="660" y="222">“ model”</text>
<rect x="15" y="245" width="779" height="43" rx="8" fill="#e0edf5"/><text x="32" y="273">3</text><text x="100" y="273" class="num">[15496, 11, 314, 716, 257, 2746, <tspan class="new">3492</tspan>]</text><text class="num" x="660" y="273">“ ready”</text>
<rect x="15" y="296" width="779" height="43" rx="8" fill="#e0edf5"/><text x="32" y="324">4</text><text x="100" y="324" class="num">[15496, 11, 314, 716, 257, 2746, 3492, <tspan class="new">284</tspan>]</text><text class="num" x="660" y="324">“ to”</text>
<rect x="15" y="347" width="779" height="43" rx="8" fill="#e0edf5"/><text x="32" y="375">5</text><text x="100" y="375" class="num">[15496, 11, 314, 716, 257, 2746, 3492, 284, <tspan class="new">1037</tspan>]</text><text class="num" x="660" y="375">“ help”</text>
<rect x="15" y="398" width="779" height="43" rx="8" fill="#e0edf5"/><text x="32" y="426">6</text><text x="100" y="426" class="num">[15496, 11, 314, 716, 257, 2746, 3492, 284, 1037, <tspan class="new">13</tspan>]</text><text class="num" x="660" y="426">“.”</text>
<text x="24" y="487">Decoded together: “Hello, I am a model ready to help.”</text></svg>
