<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
<title id="title">One token through the GPT-2 feedforward network</title>
<desc id="desc">Four tiles represent 768 input coordinates. The first linear layer produces sixteen tiles, or 3072 coordinates. GELU transforms each of these. The second linear layer combines them into four tiles, or 768 output coordinates.</desc>
<style>text{font:19px Arial,sans-serif;fill:#172b45}.heading{font-size:25px;font-weight:bold}.detail{font-size:17px}</style>
<rect width="800" height="410" rx="16" fill="#f8fafc"/>
<text x="25" y="40" class="heading">How wide is one token vector at each step?</text>
<text x="25" y="73" class="detail">Each tile stands for 192 coordinates. Read from top to bottom.</text>
