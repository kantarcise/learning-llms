<svg xmlns="http://www.w3.org/2000/svg" width="770" height="478" viewBox="0 0 770 478" role="img" aria-labelledby="title desc"><title id="title">Six calls, six new tokens</title><desc id="desc">The appended token becomes part of the prefix on the next row.</desc><style>text{font:19px Arial,sans-serif;fill:#17344a}.heading{font-size:25px;font-weight:bold}.code{font:18px monospace}</style><rect width="770" height="478" rx="16" fill="#f8fafc"/><text class="heading" x="24" y="40">Six calls, six new tokens</text>
<text x="24" y="86" class="">Call</text>
<text x="104" y="86" class="">Prompt so far</text>
<text x="586" y="86" class="">Append one token</text>
<rect x="20" y="102" width="535" height="41" rx="9" fill="#e2edf8"/>
<rect x="570" y="102" width="177" height="41" rx="9" fill="#ceebe1"/>
<text x="37" y="129" class="">1</text>
<text x="104" y="129" class="">Hello, I am</text>
<text x="588" y="129" class="code">&#x27; a&#x27;</text>
<rect x="20" y="151" width="535" height="41" rx="9" fill="#e2edf8"/>
<rect x="570" y="151" width="177" height="41" rx="9" fill="#ceebe1"/>
<text x="37" y="178" class="">2</text>
<text x="104" y="178" class="">Hello, I am a</text>
<text x="588" y="178" class="code">&#x27; model&#x27;</text>
<rect x="20" y="200" width="535" height="41" rx="9" fill="#e2edf8"/>
<rect x="570" y="200" width="177" height="41" rx="9" fill="#ceebe1"/>
<text x="37" y="227" class="">3</text>
<text x="104" y="227" class="">Hello, I am a model</text>
<text x="588" y="227" class="code">&#x27; ready&#x27;</text>
<rect x="20" y="249" width="535" height="41" rx="9" fill="#e2edf8"/>
<rect x="570" y="249" width="177" height="41" rx="9" fill="#ceebe1"/>
<text x="37" y="276" class="">4</text>
<text x="104" y="276" class="">Hello, I am a model ready</text>
<text x="588" y="276" class="code">&#x27; to&#x27;</text>
<rect x="20" y="298" width="535" height="41" rx="9" fill="#e2edf8"/>
<rect x="570" y="298" width="177" height="41" rx="9" fill="#ceebe1"/>
<text x="37" y="325" class="">5</text>
<text x="104" y="325" class="">Hello, I am a model ready to</text>
<text x="588" y="325" class="code">&#x27; help&#x27;</text>
<rect x="20" y="347" width="535" height="41" rx="9" fill="#e2edf8"/>
<rect x="570" y="347" width="177" height="41" rx="9" fill="#ceebe1"/>
<text x="37" y="374" class="">6</text>
<text x="104" y="374" class="">Hello, I am a model ready to help</text>
<text x="588" y="374" class="code">&#x27;.&#x27;</text>
<text x="25" y="432" class="">After call 6</text>
<text x="160" y="432" class="">Hello, I am a model ready to help.</text>
<text x="25" y="462" class="">Quoted token text shows the leading space where present.</text>
</svg>
