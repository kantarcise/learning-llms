<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
<title id="title">Which values does dim combine?</title><desc id="desc">The matrix has rows 1,3,5 and 3,7,11. Reducing columns with dim 1 or minus 1 produces row means 3 and 7, shape 2 by 1. Reducing rows with dim 0 produces column means 2,5,8, shape 1 by 3. Both keep the reduced axis with keepdim True.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45;font-size:21px}.heading{font-size:27px;font-weight:bold}.small{font-size:18px;fill:#42566d}.code{font-family:Consolas,monospace;font-size:20px}.arrow{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="820" height="760" rx="16" fill="#f8fafc"/>
<text x="30" y="45" class="heading">Which values does dim combine?</text>
<text x="30" y="78" class="small">Same matrix in both panels: two examples, three features per example.</text>
<rect x="25" y="105" width="770" height="265" rx="14" fill="#edf3fc"/>
<text x="45" y="143" class="code">dim=1 (or dim=-1): across the columns</text>
<text x="45" y="174" class="small">Combine features within each example → one mean per row.</text>
<rect x="25" y="390" width="770" height="340" rx="14" fill="#f0edf8"/>
<text x="45" y="430" class="code">dim=0: down the rows</text>
<text x="45" y="461" class="small">Combine examples within each feature → one mean per column.</text>
<rect x="180" y="200" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="222.5" y="231" text-anchor="middle">1</text>
<rect x="285" y="200" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="327.5" y="231" text-anchor="middle">3</text>
<rect x="390" y="200" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="432.5" y="231" text-anchor="middle">5</text>
<rect x="180" y="260" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="222.5" y="291" text-anchor="middle">3</text>
<rect x="285" y="260" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="327.5" y="291" text-anchor="middle">7</text>
<rect x="390" y="260" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="432.5" y="291" text-anchor="middle">11</text>
<rect x="180" y="487" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="222.5" y="518" text-anchor="middle">1</text>
<rect x="285" y="487" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="327.5" y="518" text-anchor="middle">3</text>
<rect x="390" y="487" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="432.5" y="518" text-anchor="middle">5</text>
<rect x="180" y="547" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="222.5" y="578" text-anchor="middle">3</text>
<rect x="285" y="547" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="327.5" y="578" text-anchor="middle">7</text>
<rect x="390" y="547" width="85" height="48" rx="7" fill="#fff" stroke="#8299ba"/><text class="code" x="432.5" y="578" text-anchor="middle">11</text>
<path class="arrow" d="M490 224 H580"/>
<rect x="590" y="200" width="85" height="48" rx="7" fill="#dcefe8" stroke="#8299ba"/><text class="code" x="632.5" y="231" text-anchor="middle">3</text>
<path class="arrow" d="M490 284 H580"/>
<rect x="590" y="260" width="85" height="48" rx="7" fill="#dcefe8" stroke="#8299ba"/><text class="code" x="632.5" y="291" text-anchor="middle">7</text>
<text class="code" x="410" y="345" text-anchor="middle">keepdim=True → shape [2,1]</text>
<path class="arrow" d="M222.5 595 V625"/>
<rect x="180" y="630" width="85" height="48" rx="7" fill="#dcefe8" stroke="#8299ba"/><text class="code" x="222.5" y="661" text-anchor="middle">2</text>
<path class="arrow" d="M327.5 595 V625"/>
<rect x="285" y="630" width="85" height="48" rx="7" fill="#dcefe8" stroke="#8299ba"/><text class="code" x="327.5" y="661" text-anchor="middle">5</text>
<path class="arrow" d="M432.5 595 V625"/>
<rect x="390" y="630" width="85" height="48" rx="7" fill="#dcefe8" stroke="#8299ba"/><text class="code" x="432.5" y="661" text-anchor="middle">8</text>
<text class="code" x="410" y="710" text-anchor="middle">keepdim=True → shape [1,3]</text></svg>
