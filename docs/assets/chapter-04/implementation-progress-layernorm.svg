<svg xmlns="http://www.w3.org/2000/svg" width="820" height="710" viewBox="0 0 820 710" role="img" aria-labelledby="title desc"><title id="title">Chapter 4 progress after layer normalization</title><desc id="desc">The placeholder GPT backbone and LayerNorm are covered. GELU and feedforward are next, then shortcuts, transformer blocks, and final GPT assembly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45;font-size:21px}.heading{font-size:27px;font-weight:bold}.small{font-size:18px;fill:#42566d}</style><rect width="820" height="710" rx="16" fill="#f8fafc"/><text x="30" y="45" class="heading">From the outline to working components</text><text x="30" y="78" class="small">Chapter 4 implementation milestones · after Section 4.2</text>
<rect x="30" y="105" width="760" height="85" rx="12" fill="#dcefe8" stroke="#8299ba"/><text x="410" y="138" text-anchor="middle">1 · GPT placeholder backbone</text><text x="410" y="167" text-anchor="middle" class="small">Covered in 4.1: the outline and its input/output shapes.</text>
<path d="M410 190 V218" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="220" width="760" height="85" rx="12" fill="#dcefe8" stroke="#8299ba"/><text x="410" y="253" text-anchor="middle">2 · Layer normalization</text><text x="410" y="282" text-anchor="middle" class="small">Covered in 4.2: statistics, standardization, learned scale and shift.</text>
<path d="M410 305 V333" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="335" width="760" height="85" rx="12" fill="#fff0d6" stroke="#8299ba"/><text x="410" y="368" text-anchor="middle">3 · GELU → 4 · Feedforward network</text><text x="410" y="397" text-anchor="middle" class="small">Next in 4.3: the activation and the network that uses it.</text>
<path d="M410 420 V448" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="450" width="760" height="85" rx="12" fill="#edf3fc" stroke="#8299ba"/><text x="410" y="483" text-anchor="middle">5 · Shortcut connections</text><text x="410" y="512" text-anchor="middle" class="small">Then: preserve a residual path around each sublayer.</text>
<path d="M410 535 V563" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="565" width="760" height="85" rx="12" fill="#edf3fc" stroke="#8299ba"/><text x="410" y="598" text-anchor="middle">6 · Transformer block → 7 · Complete GPT</text><text x="410" y="627" text-anchor="middle" class="small">Then: assemble the components, including Chapter 3 attention.</text>
<text x="410" y="686" text-anchor="middle" class="small">The dummy model remains an outline until the real components are assembled.</text></svg>
