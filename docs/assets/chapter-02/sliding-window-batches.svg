<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1020" viewBox="0 0 1100 1020" role="img" aria-labelledby="title desc"><title id="title">Sliding windows: inputs and one-token-shifted targets</title><desc id="desc">Original text Small models learn from text. We train them one batch at a time. GPT-2 encoding yields fifteen IDs. Three windows of length four start at offsets zero, four, and eight. Each target window starts one token after its input window. Dataset items are length-four integer tensors; a batch of three has input and target shapes three by four.</desc><rect width="1100" height="1020" fill="#f5f7fb"/>
<text x="35" y="47" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#26364c" font-weight="700">One token stream → paired training tensors</text>
<text x="35" y="82" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#26364c" font-weight="400">GPT-2 encoding · window length 4 · stride 4 · batch size 3 · shuffle off</text>
