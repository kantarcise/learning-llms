<text x="45" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#26364c" font-weight="400">Small models learn from text. We train them one batch at a time.</text>
<text x="45" y="215" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#26364c" font-weight="400">First five positions: four inputs need a fifth token for the final target.</text>
