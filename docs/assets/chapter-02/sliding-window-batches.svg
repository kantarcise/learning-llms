<text x="45" y="903" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#26364c" font-weight="700">Targets are token IDs—not scores. Each target is the next token after its aligned input.</text>
<text x="45" y="938" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26364c" font-weight="400">Example: [Small] → ·models; [Small, ·models] → ·learn; …; all four losses can be computed together.</text>
<text x="45" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26364c" font-weight="400">The dot · marks a leading space for readability. Word labels explain the IDs; tensors contain only integers.</text>
<text x="45" y="1001" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#26364c" font-weight="400">Stride moves the next window by 4. The target shift is always 1. Two trailing tokens are unused here.</text>
