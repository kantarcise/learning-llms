<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Window length four: stride one versus stride four</title><desc id="desc">Three successive windows on the same numbered token stream. Stride one starts at positions zero, one, and two, overlapping by three tokens. Stride four starts at zero, four, and eight, with no input overlap. Each window still predicts a next token at all four positions.</desc><rect width="1000" height="680" fill="#f5f7fb"/>
