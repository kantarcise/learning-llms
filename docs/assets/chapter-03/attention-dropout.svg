<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc">
<title id="title">Dropout removes permitted contributions during training</title>
<desc id="desc">Four query rows and four value columns. One chosen dropout mask zeros all allowed entries in row two. Surviving weights double at p equals 0.5. Future weights remain zero. Row sums after dropout are 2, 0, 1.4, and 1.</desc>
