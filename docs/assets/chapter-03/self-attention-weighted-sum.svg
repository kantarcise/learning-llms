<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
<style>
/* Math variables are italic; numerals, operators, and prose stay upright.
   Local font fallbacks only. Literal Python and tensor shapes use monospace. */
.math { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-style: italic; font-weight: normal; }
.math-upright { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-style: normal; font-weight: normal; }
.code { font-family: "DejaVu Sans Mono", Consolas, monospace; font-style: normal; font-weight: normal; }
</style><title id="title">Compute the second context vector with softmax weights</title><desc id="desc">Four invented three-number input vectors contribute to the context vector for the second position, models. Softmax weights are approximately 0.0128, 0.6964, 0.0347, 0.2562; the context vector is approximately [0.0474, 1.6836, 1.2215].</desc><rect width="1000" height="850" fill="#f5f7fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#526783"/></marker></defs>
<text x="40" y="50" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#26364c">Finish the context vector for “models”</text>
<text x="40" y="93" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#26364c">One sequence · 4 positions · 3 coordinates per input vector</text>
<rect x="40" y="145" width="200" height="125" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="55" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">1. Small</text>
<text x="55" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c"><tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(1)</tspan></text>
<text x="55" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c"><tspan class="code" xml:space="preserve">[1, 0, 1]</tspan></text>
<rect x="280" y="145" width="200" height="125" rx="12" fill="#d8f1eb" stroke="#aebed1"/>
<text x="295" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">2. models</text>
<text x="295" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c"><tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(2)</tspan></text>
<text x="295" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c"><tspan class="code" xml:space="preserve">[0, 2, 1]</tspan></text>
<rect x="520" y="145" width="200" height="125" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="535" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">3. learn</text>
<text x="535" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c"><tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(3)</tspan></text>
<text x="535" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c"><tspan class="code" xml:space="preserve">[1, 1, 0]</tspan></text>
<rect x="760" y="145" width="200" height="125" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="775" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">4. patterns</text>
<text x="775" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c"><tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(4)</tspan></text>
<text x="775" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c"><tspan class="code" xml:space="preserve">[0, 1, 2]</tspan></text>
<path d="M140 275 L140 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="70" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c"><tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">21</tspan> ≈ 0.0128</text>
<path d="M140 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M380 275 L380 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="290" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="310" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c"><tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">22</tspan> ≈ 0.6964</text>
<path d="M380 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M620 275 L620 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="530" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="550" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c"><tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">23</tspan> ≈ 0.0347</text>
<path d="M620 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M860 275 L860 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="770" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="790" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c"><tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">24</tspan> ≈ 0.2562</text>
<path d="M860 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="270" y="535" width="460" height="90" rx="12" fill="#d8f1eb" stroke="#aebed1"/>
<text x="300" y="570" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#26364c">Sum: scalar × vector, for each input</text>
<text x="300" y="604" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c"><tspan class="math">z</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(2)</tspan> ≈ [0.0474, 1.6836, 1.2215]</text>
<text x="40" y="682" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#26364c"><tspan class="math">z</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(2)</tspan> = <tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">21</tspan> <tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(1)</tspan> + <tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">22</tspan> <tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(2)</tspan> + <tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">23</tspan> <tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(3)</tspan> + <tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">24</tspan> <tspan class="math">x</tspan><tspan class="math-upright" baseline-shift="super" font-size="70%">(4)</tspan></text>
<text x="40" y="728" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c"><tspan class="math">α</tspan><tspan class="math-upright" baseline-shift="sub" font-size="70%">23</tspan> means: contribution from position 3 when updating position 2.</text>
<text x="40" y="770" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">Repeat with a different set of weights for each other output position.</text>
<text x="40" y="810" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">Softmax(<tspan class="code" xml:space="preserve">[1, 5, 2, 4]</tspan>); rounded display, full-precision calculation.</text>
</svg>
