<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">One context vector for each input position</title><desc id="desc">Four invented three-number input vectors contribute to the context vector for the second position, models. Each is multiplied by its own attention weight before summing.</desc><rect width="1000" height="850" fill="#f5f7fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#526783"/></marker></defs>
<text x="40" y="50" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#26364c">The goal: enrich the vector for “models”</text>
<text x="40" y="93" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#26364c">One sequence · 4 positions · 3 coordinates per input vector</text>
<rect x="40" y="145" width="200" height="125" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="55" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">1. Small</text>
<text x="55" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">x<tspan baseline-shift="super" font-size="70%">(1)</tspan></text>
<text x="55" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c">[1, 0, 1]</text>
<rect x="280" y="145" width="200" height="125" rx="12" fill="#d8f1eb" stroke="#aebed1"/>
<text x="295" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">2. models</text>
<text x="295" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">x<tspan baseline-shift="super" font-size="70%">(2)</tspan></text>
<text x="295" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c">[0, 2, 1]</text>
<rect x="520" y="145" width="200" height="125" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="535" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">3. learn</text>
<text x="535" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">x<tspan baseline-shift="super" font-size="70%">(3)</tspan></text>
<text x="535" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c">[1, 1, 0]</text>
<rect x="760" y="145" width="200" height="125" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="775" y="178" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">4. patterns</text>
<text x="775" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">x<tspan baseline-shift="super" font-size="70%">(4)</tspan></text>
<text x="775" y="250" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#26364c">[0, 1, 2]</text>
<path d="M140 275 L140 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="70" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">× weight α<tspan baseline-shift="sub" font-size="70%">21</tspan></text>
<path d="M140 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M380 275 L380 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="290" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="310" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">× weight α<tspan baseline-shift="sub" font-size="70%">22</tspan></text>
<path d="M380 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M620 275 L620 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="530" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="550" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">× weight α<tspan baseline-shift="sub" font-size="70%">23</tspan></text>
<path d="M620 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M860 275 L860 340" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="770" y="350" width="180" height="60" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="790" y="389" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">× weight α<tspan baseline-shift="sub" font-size="70%">24</tspan></text>
<path d="M860 415 L500 525" stroke="#526783" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="270" y="535" width="460" height="90" rx="12" fill="#d8f1eb" stroke="#aebed1"/>
<text x="300" y="570" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#26364c">Sum the four weighted vectors</text>
<text x="300" y="604" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">z<tspan baseline-shift="super" font-size="70%">(2)</tspan>: still a vector of 3 numbers</text>
<text x="40" y="682" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#26364c">z<tspan baseline-shift="super" font-size="70%">(2)</tspan> = α<tspan baseline-shift="sub" font-size="70%">21</tspan> x<tspan baseline-shift="super" font-size="70%">(1)</tspan> + α<tspan baseline-shift="sub" font-size="70%">22</tspan> x<tspan baseline-shift="super" font-size="70%">(2)</tspan> + α<tspan baseline-shift="sub" font-size="70%">23</tspan> x<tspan baseline-shift="super" font-size="70%">(3)</tspan> + α<tspan baseline-shift="sub" font-size="70%">24</tspan> x<tspan baseline-shift="super" font-size="70%">(4)</tspan></text>
<text x="40" y="728" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">α<tspan baseline-shift="sub" font-size="70%">23</tspan> means: contribution from position 3 when updating position 2.</text>
<text x="40" y="770" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#26364c">Repeat with a different set of weights for each other output position.</text>
<text x="40" y="810" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">Invented inputs; weights are symbolic here. No causal mask yet.</text>
</svg>
