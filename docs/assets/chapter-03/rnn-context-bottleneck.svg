<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">A basic recurrent encoder-decoder without attention</title><desc id="desc">Five encoder steps update a hidden state. Only the final encoder state is passed to initialize the decoder. Decoder states evolve as previous output tokens are fed back. Earlier encoder states have no direct route to the decoder in this design.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677f"/></marker></defs><rect width="1000" height="1000" fill="#f5f7fb"/>
<text x="35" y="50" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#26364c">One fixed-size summary connects two sequences</text>
<text x="35" y="90" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">Basic recurrent encoder–decoder WITHOUT attention</text>
<text x="35" y="145" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">ENCODER: update the state as each source word arrives</text>
