<text x="45" y="885" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#26364c">No direct access from decoder steps to h1, h2, h3, or h4 in this design.</text>
<text x="45" y="927" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">The decoder state changes; the source information must survive the summary.</text>
<text x="45" y="965" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#26364c">Illustrative outputs, not a trained model run. Words stand in for tokens.</text>
