<text x="55" y="385" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">Same encoder weights reused at each step; h1 … h5 are changing activations.</text>
<path d="M867,360 L867,430" stroke="#52677f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="240" y="445" width="700" height="85" rx="10" fill="#ffe1b5" stroke="#b5c6d9"/>
<text x="255" y="478" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#26364c">h5: the source summary handed to the decoder</text>
<text x="255" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#26364c">Its width stays fixed as the source sequence gets longer.</text>
<path d="M240,488 L30,488 L30,680 L53,680" stroke="#52677f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="55" y="585" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#26364c">DECODER: use that summary to begin generation</text>
<text x="55" y="620" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#26364c">Start marker first; each following step also receives the previous output token.</text>
