<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">Four steps toward GPT-style attention</title><desc id="desc">Start with simplified self-attention, introduce trainable query key and value projections, mask future positions for causal attention, then combine multiple attention heads. These build on each other; causal and multi-head attention retain trainable projections.</desc><rect width="960" height="960" fill="#f5f7fb"/>
<text x="40" y="50" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#26364c">Chapter 3: build attention one idea at a time</text>
<text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#26364c">Start with the input vectors prepared in Chapter 2.</text>
<rect x="40" y="125" width="880" height="155" rx="12" fill="#fff" stroke="#ccd6e4"/>
<text x="60" y="163" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#26364c">1. Simplified self-attention</text>
<text x="815" y="163" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">§ 3.3</text>
<text x="65" y="208" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#26364c">Understand scores, mixing amounts, and weighted combinations.</text>
<text x="65" y="245" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">No trainable query/key/value projections yet.</text>
<text x="465" y="307" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#26364c">↓</text>
<rect x="40" y="310" width="880" height="155" rx="12" fill="#dce9ff" stroke="#ccd6e4"/>
<text x="60" y="348" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#26364c">2. Self-attention with trainable weights</text>
<text x="815" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">§ 3.4</text>
<text x="65" y="393" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#26364c">Introduce learned projections to create queries, keys, and values.</text>
<text x="65" y="430" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">The model learns how to form its attention calculation.</text>
<text x="465" y="492" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#26364c">↓</text>
<rect x="40" y="495" width="880" height="155" rx="12" fill="#d8f1eb" stroke="#ccd6e4"/>
<text x="60" y="533" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#26364c">3. Causal attention</text>
<text x="815" y="533" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">§ 3.5</text>
<text x="65" y="578" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#26364c">Keep the learned projections; hide future token positions.</text>
<text x="65" y="615" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">Each position uses only itself and earlier positions.</text>
<text x="465" y="677" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#26364c">↓</text>
<rect x="40" y="680" width="880" height="155" rx="12" fill="#fff" stroke="#ccd6e4"/>
<text x="60" y="718" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#26364c">4. Multi-head attention</text>
<text x="815" y="718" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">§ 3.6</text>
<text x="65" y="763" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#26364c">Combine several attention calculations inside one attention layer.</text>
<text x="65" y="800" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#26364c">Our GPT-style version keeps the causal restriction.</text>
<text x="40" y="915" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#26364c">These ideas build on each other. Trainable, causal, and multi-head can coexist.</text>
</svg>