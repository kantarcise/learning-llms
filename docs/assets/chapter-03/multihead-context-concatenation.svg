<rect x="35" y="1220" width="930" height="130" rx="10" fill="#fff1cf" stroke="#aebed1"/>
<text x="500" y="1259" font-size="25" text-anchor="middle">[2, 6, 4] = sentences × tokens × combined coordinates</text>
<text x="500" y="1297" font-size="22" text-anchor="middle">The first 2 counts batch examples. Head outputs are joined into the final 4.</text>
<text x="500" y="1330" font-size="21" text-anchor="middle">Duplicate inputs give duplicate tables here because dropout is zero.</text>
