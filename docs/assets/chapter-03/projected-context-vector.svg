<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">Combine value vectors into context for query two</title><desc id="desc">Six scalar attention weights multiply the corresponding two-coordinate value vectors. Sum the six weighted vectors to produce [0.3061,0.8210].</desc><rect width="1000" height="1000" fill="#f5f7fb"/>
<text x="40" y="55" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#26364c">Values supply the information we mix</text>
<text x="40" y="110" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#26364c">Queries and keys determined α; now apply α to the value vectors.</text>
<text x="55" y="185" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">Position</text>
<text x="255" y="185" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">Weight α<tspan baseline-shift="sub" font-size="70%">2j</tspan></text>
<text x="445" y="185" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">Value v<tspan baseline-shift="super" font-size="70%">(j)</tspan></text>
<text x="730" y="185" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">Contribution</text>
<rect x="40" y="215" width="920" height="69" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="55" y="258" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">1. Your</text>
<text x="255" y="258" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">0.1500</text>
<text x="420" y="258" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">× [0.1855, 0.8812]</text>
<text x="710" y="258" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">[0.0278, 0.1322]</text>
<rect x="40" y="294" width="920" height="69" rx="12" fill="#d8f1eb" stroke="#aebed1"/>
<text x="55" y="337" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">2. journey</text>
<text x="255" y="337" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">0.2264</text>
<text x="420" y="337" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">× [0.3951, 1.0037]</text>
<text x="710" y="337" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">[0.0895, 0.2272]</text>
<rect x="40" y="373" width="920" height="69" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="55" y="416" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">3. starts</text>
<text x="255" y="416" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">0.2199</text>
<text x="420" y="416" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">× [0.3879, 0.9831]</text>
<text x="710" y="416" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">[0.0853, 0.2162]</text>
<rect x="40" y="452" width="920" height="69" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="55" y="495" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">4. with</text>
<text x="255" y="495" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">0.1311</text>
<text x="420" y="495" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">× [0.2393, 0.5493]</text>
<text x="710" y="495" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">[0.0314, 0.0720]</text>
<rect x="40" y="531" width="920" height="69" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="55" y="574" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">5. one</text>
<text x="255" y="574" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">0.0906</text>
<text x="420" y="574" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">× [0.1492, 0.3346]</text>
<text x="710" y="574" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">[0.0135, 0.0303]</text>
<rect x="40" y="610" width="920" height="69" rx="12" fill="#fff" stroke="#aebed1"/>
<text x="55" y="653" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">6. step</text>
<text x="255" y="653" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">0.1820</text>
<text x="420" y="653" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">× [0.3221, 0.7863]</text>
<text x="710" y="653" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">[0.0586, 0.1431]</text>
<text x="440" y="740" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#26364c">↓ Sum the contributions</text>
<rect x="130" y="775" width="740" height="100" rx="12" fill="#dce9ff" stroke="#aebed1"/>
<text x="165" y="815" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#26364c">z<tspan baseline-shift="super" font-size="70%">(2)</tspan> ≈ [0.3061, 0.8210]</text>
<text x="165" y="855" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#26364c">[6] weights @ [6, 2] values → [2] context vector</text>
<text x="40" y="925" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#26364c">Two output coordinates because each value vector has width two.</text>
<text x="40" y="975" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#26364c">Full-precision calculation; rounded display. No residual addition here.</text>
</svg>
