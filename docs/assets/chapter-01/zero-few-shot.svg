<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Zero-shot versus few-shot translation prompts</title><desc id="desc">Both prompts ask for a German translation of phone. The zero-shot prompt has no demonstrations. The few-shot prompt includes cat and house translation pairs. No model weights are updated.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#476582" stroke-width="2"/></marker></defs><rect width="1000" height="510" fill="white"/><g font-family="Arial, sans-serif" fill="#172b4d">
<text x="25" y="38" font-size="26" font-weight="bold">Same task, different prompt context</text>
<rect x="25" y="65" width="460" height="300" rx="12" fill="#edf2fa" stroke="#476582" stroke-width="1.5"/>
<text x="43" y="100" font-size="21" font-weight="bold">Zero-shot: no demonstrations</text>
<text x="43" y="143" font-size="18" font-weight="normal">Translate English to German.</text>
<text x="43" y="176" font-size="18" font-weight="normal"></text>
<text x="43" y="209" font-size="18" font-weight="normal">English: phone</text>
<text x="43" y="242" font-size="18" font-weight="normal">German:</text>
<path d="M255 365 V394" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="43" y="428" font-size="19" font-weight="bold">Illustrative expected answer: Telefon</text>
<rect x="515" y="65" width="460" height="300" rx="12" fill="#e5f1ee" stroke="#476582" stroke-width="1.5"/>
<text x="533" y="100" font-size="21" font-weight="bold">Few-shot: two demonstrations</text>
<text x="533" y="143" font-size="18" font-weight="normal">Translate English to German.</text>
<text x="533" y="176" font-size="18" font-weight="normal">English: cat → German: Katze</text>
<text x="533" y="209" font-size="18" font-weight="normal">English: house → German: Haus</text>
<text x="533" y="242" font-size="18" font-weight="normal"></text>
<text x="533" y="275" font-size="18" font-weight="normal">English: phone</text>
<text x="533" y="308" font-size="18" font-weight="normal">German:</text>
<path d="M745 365 V394" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="533" y="428" font-size="19" font-weight="bold">Illustrative expected answer: Telefon</text>
<text x="25" y="478" font-size="19" font-weight="normal">Both use existing weights. Adding prompt examples does not perform backpropagation.</text>
</g></svg>