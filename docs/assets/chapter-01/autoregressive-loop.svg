<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Autoregressive generation: predict, append, repeat</title><desc id="desc">Starting with This, the same model predicts is, then an, then example. Each selected token is appended before the next prediction. Model weights do not change.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#476582" stroke-width="2"/></marker></defs><rect width="1000" height="640" fill="white"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="30" y="38" font-size="26" font-weight="bold">Generate → append → predict again</text><text x="45" y="85" font-size="19">Available context</text><text x="445" y="85" font-size="19">Same GPT-like model</text><text x="770" y="85" font-size="19">Selected next token</text>
<rect x="30" y="110" width="345" height="65" rx="12" fill="#edf2fa" stroke="#476582"/><text x="48" y="150" font-size="23">This</text>
<rect x="425" y="110" width="255" height="65" rx="12" fill="#e5f1ee" stroke="#476582"/><text x="443" y="150" font-size="23">Forward → scores</text>
<rect x="760" y="110" width="210" height="65" rx="12" fill="#fff3da" stroke="#476582"/><text x="778" y="150" font-size="23">is</text>
<path d="M375 142 H415" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 142 H750" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="205" font-size="17">Append the selected token to the context.</text>
<rect x="30" y="235" width="345" height="65" rx="12" fill="#edf2fa" stroke="#476582"/><text x="48" y="275" font-size="23">This is</text>
<rect x="425" y="235" width="255" height="65" rx="12" fill="#e5f1ee" stroke="#476582"/><text x="443" y="275" font-size="23">Forward → scores</text>
<rect x="760" y="235" width="210" height="65" rx="12" fill="#fff3da" stroke="#476582"/><text x="778" y="275" font-size="23">an</text>
<path d="M375 267 H415" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 267 H750" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="330" font-size="17">Append the selected token to the context.</text>
<rect x="30" y="360" width="345" height="65" rx="12" fill="#edf2fa" stroke="#476582"/><text x="48" y="400" font-size="23">This is an</text>
<rect x="425" y="360" width="255" height="65" rx="12" fill="#e5f1ee" stroke="#476582"/><text x="443" y="400" font-size="23">Forward → scores</text>
<rect x="760" y="360" width="210" height="65" rx="12" fill="#fff3da" stroke="#476582"/><text x="778" y="400" font-size="23">example</text>
<path d="M375 392 H415" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 392 H750" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="455" font-size="17">Append the selected token to the context.</text>
<rect x="30" y="495" width="940" height="65" rx="12" fill="#f0ecfa" stroke="#79639c"/><text x="48" y="535" font-size="24" font-weight="bold">Result: This is an example</text><text x="30" y="600" font-size="18">Weights stay fixed. Word-sized tokens are illustrative; real boundaries depend on the tokenizer.</text><text x="30" y="627" font-size="17">During training, shifted correct targets let us compute many positions together with causal masking.</text></g></svg>