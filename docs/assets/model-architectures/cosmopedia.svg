<text x="952" y="296" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">width 256</text>
<polyline points="1105,273 1170,273" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1190,200 l14,-14 h290 l-14,14 Z" fill="#fff5e7" stroke="#d7ae73"/>
<path d="M1480,200 l14,-14 v155 l-14,14 Z" fill="#d7ae73"/>
<rect x="1190" y="200" width="290" height="155" fill="#ffebcf" stroke="#d7ae73"/>
<text x="1210" y="239" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#26364c" font-weight="700">Vocabulary projection</text>
<text x="1210" y="275" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#26364c" font-weight="400">256 → 49,152</text>
<text x="1210" y="310" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#26364c" font-weight="400">Logits [B, T, 49,152]</text>
<text x="70" y="399" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26364c" font-weight="400">Integer IDs become floating-point vectors; transformer blocks keep the same number of positions and the same vector width.</text>
<text x="70" y="435" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26364c" font-weight="400">Generation selects from the final position’s logits. Training compares each supervised position with its next-token target.</text>
<rect x="32" y="500" width="1536" height="360" rx="20" fill="white" stroke="#dbe2ed"/>
<text x="58" y="536" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#65738a" font-weight="700">02   INSIDE ONE BLOCK  /  REPEATED FOUR TIMES WITH DIFFERENT WEIGHTS</text>
<text x="65" y="620" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#26364c" font-weight="700">x</text>
<polyline points="85,615 160,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M175,585 l10,-10 h105 l-10,10 Z" fill="#f7efff" stroke="#b397d1"/>
<path d="M280,585 l10,-10 v65 l-10,10 Z" fill="#b397d1"/>
