<rect x="610" y="210" width="184" height="130" fill="#dce8ff" stroke="#8eaee2"/>
<text x="627" y="253" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#26364c" font-weight="700">Transformer</text>
<text x="627" y="283" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#26364c" font-weight="400">4 blocks</text>
<text x="627" y="315" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#26364c" font-weight="400">[B, T, 256]</text>
<polyline points="850,273 915,273" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M935,230 l14,-14 h150 l-14,14 Z" fill="#f7efff" stroke="#b397d1"/>
