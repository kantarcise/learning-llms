<rect x="1170" y="589" width="55" height="52" fill="#dce8ff" stroke="#8eaee2"/>
<polyline points="1004,615 1020,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="1152,615 1166,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="943" y="622" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26364c" font-weight="400">256</text>
<text x="1048" y="606" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#26364c" font-weight="700">1024</text>
<text x="1053" y="637" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#26364c" font-weight="400">GELU</text>
<text x="1178" y="622" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#26364c" font-weight="400">256</text>
<text x="954" y="700" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#26364c" font-weight="400">Linear 256→1024   ·   Linear 1024→256</text>
<polyline points="1243,615 1318,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="1340" cy="615" r="22" fill="#fff" stroke="#46566b" stroke-width="2"/>
<text x="1333" y="622" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#26364c" font-weight="700">+</text>
<polyline points="1366,615 1465,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1480" y="623" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#26364c" font-weight="700">z</text>
<polyline points="700,615 700,555 1340,555 1340,591" fill="none" stroke="#438d79" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1020" y="551" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#327763" font-weight="400">shortcut: y</text>
<text x="65" y="748" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#26364c" font-weight="700">y = x + attention(norm1(x))      z = y + feedforward(norm2(y))</text>
<text x="65" y="788" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">x, y, z: [B, T, 256]     Feedforward intermediate: [B, T, 1024]     Each norm has its own learned scale and shift.</text>
<text x="65" y="826" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#26364c" font-weight="400">Attention mixes accessible positions. The feedforward network transforms each position separately using shared weights.</text>
<rect x="32" y="884" width="748" height="191" rx="20" fill="white" stroke="#dbe2ed"/>
<rect x="800" y="884" width="768" height="191" rx="20" fill="white" stroke="#dbe2ed"/>
<text x="56" y="922" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#65738a" font-weight="700">03   STORED WEIGHT TABLES</text>
<text x="56" y="960" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#26364c" font-weight="700">Token embeddings: 49,152 rows × 256 coordinates</text>
<text x="56" y="994" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">Position embeddings: 256 rows × 256 coordinates</text>
<text x="56" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">Output reuses the token table (weight tying).</text>
<text x="824" y="922" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#65738a" font-weight="700">04   ATTENTION DETAIL</text>
<text x="824" y="960" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">One combined projection: 256 → 768 → split Q, K, V</text>
<text x="824" y="994" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">4 heads × 64 coordinates → concatenate → width 256</text>
<text x="824" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">Causal softmax(QKᵀ / √64) V, then output projection.</text>
<text x="48" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#65738a" font-weight="400">B = batch examples · T = input positions · Block sizes are schematic, not parameter counts or spatial image dimensions.</text>
</svg>