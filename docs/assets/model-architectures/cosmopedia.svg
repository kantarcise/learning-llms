<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Cosmopedia model architecture</title>
<desc id="desc">Code-derived decoder-only transformer: learned token and position embeddings, 4 pre-normalized blocks, final LayerNorm, and vocabulary logits. Each block has causal attention and a GELU feedforward network with two residual additions. Width 256, feedforward width 1024, 4 attention heads. Input and output share weights.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#46566b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1120" fill="#f5f7fb"/>
<text x="48" y="53" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#26364c" font-weight="700">Cosmopedia / architecture from the code</text>
<text x="48" y="87" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#26364c" font-weight="400">15,803,904 trainable parameters   •   4 blocks   •   4 attention heads per block   •   maximum context 256</text>
<rect x="32" y="116" width="1536" height="360" rx="20" fill="white" stroke="#dbe2ed"/>
<text x="58" y="151" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#65738a" font-weight="700">01   THE WHOLE MODEL</text>
