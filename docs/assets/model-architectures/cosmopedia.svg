<text x="187" y="624" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="400">Norm 1</text>
<polyline points="297,615 340,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M355,570 l14,-14 h200 l-14,14 Z" fill="#eff4ff" stroke="#8eaee2"/>
