<text x="371" y="603" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#26364c" font-weight="700">Causal attention</text>
<text x="371" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#26364c" font-weight="400">+ output projection</text>
<polyline points="574,615 608,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="630" cy="615" r="22" fill="#fff" stroke="#46566b" stroke-width="2"/>
<text x="623" y="622" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#26364c" font-weight="700">+</text>
<text x="663" y="623" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#26364c" font-weight="700">y</text>
<polyline points="105,615 105,555 630,555 630,591" fill="none" stroke="#438d79" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285" y="551" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#327763" font-weight="400">shortcut: x</text>
<polyline points="688,615 740,615" fill="none" stroke="#46566b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M755,585 l10,-10 h105 l-10,10 Z" fill="#f7efff" stroke="#b397d1"/>
<path d="M860,585 l10,-10 v65 l-10,10 Z" fill="#b397d1"/>
<rect x="755" y="585" width="105" height="65" fill="#eee3fa" stroke="#b397d1"/>
