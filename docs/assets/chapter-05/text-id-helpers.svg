<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">Text to IDs and back for one generation step</title><desc id="desc">Four encoded IDs produce four vocabulary score rows. Greedy selection appends ID 34245. The five IDs decode to Every effort moves you renting.</desc><style>text{font:19px Arial,sans-serif;fill:#19364a}.title{font-weight:bold;font-size:25px}.code{font:17px monospace}</style><rect width="760" height="490" rx="16" fill="#f8fafc"/><text x="25" y="42" class="title">One generation step from text back to text</text>
<rect x="24" y="65" width="712" height="110" rx="12" fill="#dcecfb"/><text x="45" y="94" font-weight="bold">1 · Encode one prompt</text><text x="45" y="122" class="code">text_to_token_ids</text><text x="45" y="151">“Every effort moves you” → [[6109, 3626, 6100, 345]]</text>
<rect x="24" y="189" width="712" height="110" rx="12" fill="#e9e5f6"/><text x="45" y="218" font-weight="bold">2 · Predict at four positions</text><text x="45" y="246" class="code">GPTModel.forward</text><text x="45" y="275">[1, 4] IDs → [1, 4, 50257] logits</text>
<rect x="24" y="313" width="712" height="110" rx="12" fill="#dcefe8"/><text x="45" y="342" font-weight="bold">3 · Choose, append, then decode</text><text x="45" y="370" class="code">generate_text_simple → token_ids_to_text</text><text x="45" y="399">Highest score in the last row: ID 34245 → append it to the four prompt IDs.</text>
<text x="25" y="462">Decoded output: “Every effort moves you renting”</text></svg>
