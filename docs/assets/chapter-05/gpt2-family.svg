<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="title desc">
  <title id="title">One GPT-2 block design, four model sizes</title>
  <desc id="desc">Token and position embeddings feed a stack of pre-normalized causal transformer blocks, each with two residual additions. Width, head count and block count increase from small through XL. Each head has 64 coordinates.</desc>
  <style>text{font:18px Arial,sans-serif;fill:#183849}.h{font-size:23px;font-weight:bold}.b{font-weight:bold}.n{text-anchor:end;font-variant-numeric:tabular-nums}</style>
  <rect width="720" height="640" rx="16" fill="#f8fafc"/>
  <text x="24" y="38" class="h">One GPT-2 design, four sizes</text>
  <text x="24" y="80">Token IDs → token + position embeddings → dropout</text>
  <path d="M46 89v21m-6-7 6 7 6-7" fill="none" stroke="#286855" stroke-width="2"/>
  <rect x="23" y="116" width="674" height="214" rx="10" fill="#dcefe8"/>
  <text x="42" y="145" class="b">Repeat once per transformer block</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#286855"/></marker></defs>
  <g fill="none" stroke="#286855" stroke-width="2" marker-end="url(#arrow)">
    <path d="M62 195h52"/><path d="M510 195h62"/>
    <path d="M85 195v-30h506v12"/>
    <path d="M591 213v18H57v26"/>
    <path d="M62 280h52"/><path d="M510 280h62"/>
    <path d="M85 280v-31h506v13"/>
    <path d="M591 298v43"/>
  </g>
  <g fill="white" stroke="#286855"><rect x="116" y="178" width="394" height="35" rx="6"/><rect x="116" y="263" width="394" height="35" rx="6"/><circle cx="591" cy="195" r="16"/><circle cx="591" cy="280" r="16"/></g>
  <g text-anchor="middle"><text x="53" y="201">x</text><text x="53" y="286">y</text><text x="313" y="202">LayerNorm 1 → masked attention → dropout</text><text x="313" y="287">LayerNorm 2 → feedforward → dropout</text><text x="591" y="201">+</text><text x="591" y="286">+</text></g>
  <text x="24" y="375">Final LayerNorm → vocabulary projection → 50,257 logits per position</text>
  <g transform="translate(0 106)">
  <rect x="22" y="305" width="675" height="38" rx="6" fill="#e0eaf4"/>
  <g class="b"><text x="36" y="330">GPT-2</text><text x="256" y="330" class="n">Width</text><text x="381" y="330" class="n">Heads</text><text x="506" y="330" class="n">Blocks</text><text x="675" y="330" class="n">Parameters</text></g>
  <g transform="translate(0 370)"><text x="36">Small</text><g class="n"><text x="256">768</text><text x="381">12</text><text x="506">12</text><text x="675">124M</text></g></g>
  <g transform="translate(0 407)"><text x="36">Medium</text><g class="n"><text x="256">1,024</text><text x="381">16</text><text x="506">24</text><text x="675">355M</text></g></g>
  <g transform="translate(0 444)"><text x="36">Large</text><g class="n"><text x="256">1,280</text><text x="381">20</text><text x="506">36</text><text x="675">774M</text></g></g>
  <g transform="translate(0 481)"><text x="36">XL</text><g class="n"><text x="256">1,600</text><text x="381">25</text><text x="506">48</text><text x="675">1,558M</text></g></g>
  </g>
</svg>
