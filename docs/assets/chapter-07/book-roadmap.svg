<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
  <title id="title">From a GPT architecture to two fine-tuning tasks</title>
  <desc id="desc">Chapters 2 to 4 build the model. Chapter 5 trains it and loads pretrained weights. Chapters 6 and 7 each start with that pretrained model.</desc>
  <rect width="640" height="410" rx="14" fill="#faf8f3"/>
  <g fill="none" stroke="#52645f" stroke-width="3" stroke-linejoin="round">
    <path d="M320 101v29m-6-7 6 7 6-7"/>
    <path d="M320 224v20H164v58m-6-7 6 7 6-7 M320 244h156v58m-6-7 6 7 6-7"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#253330">
    <rect x="45" y="10" width="550" height="90" rx="10" fill="#e0ede6"/>
    <text x="320" y="37" font-size="15">Stage 1 · Chapters 2–4</text>
    <text x="320" y="65" font-size="22" font-weight="bold">Build a GPT model</text>
    <text x="320" y="88" font-size="16">Prepare token windows → implement attention → stack blocks</text>
    <rect x="45" y="133" width="550" height="91" rx="10" fill="#e0ede6"/>
    <text x="320" y="159" font-size="15">Stage 2 · Chapter 5</text>
    <text x="320" y="187" font-size="22" font-weight="bold">Get a pretrained model</text>
    <text x="320" y="211" font-size="16">Train and evaluate a small run, then load GPT-2 weights.</text>
    <g font-size="16"><text x="164" y="280" fill="#253330" stroke="#faf8f3" stroke-width="8" paint-order="stroke">Labeled messages</text><text x="476" y="280" stroke="#faf8f3" stroke-width="8" paint-order="stroke">Instruction–response pairs</text></g>
    <rect x="18" y="305" width="292" height="89" rx="10" fill="#e0ede6"/>
    <text x="164" y="335" font-size="15">Stage 3 · Chapter 6</text>
    <text x="164" y="367" font-size="21" font-weight="bold">Predict a class label</text>
    <rect x="330" y="305" width="292" height="89" rx="10" fill="#186555"/>
    <g fill="white"><text x="476" y="335" font-size="15">Stage 3 · Chapter 7</text>
    <text x="476" y="367" font-size="21" font-weight="bold">Generate a response</text></g>
  </g>
</svg>
